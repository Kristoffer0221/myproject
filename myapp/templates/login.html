<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    {% block content %}

    <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
        
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Login</h2>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <p class="text-sm text-red-600 bg-red-100 border border-red-300 p-2 rounded-md">
                {{ message }}
            </p>
            {% endfor %}
        </div>
        {% endif %}

        <form action="{% url 'login' %}" method="POST" class="space-y-4">
            {% csrf_token %}

            <!-- Styling Django form fields -->
            <div class="space-y-2">
                {{ form.as_p }}
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition duration-200">
                Login
            </button>
        </form>

        <div class="text-center mt-5">
            <p class="text-sm text-gray-600">
                Don’t have an account?
                <a href="{% url 'register' %}" class="text-blue-600 font-semibold hover:underline">
                    Register
                </a>
            </p>
        </div>
    </div>

    {% endblock %}

</body>

</html>
